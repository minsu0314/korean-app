<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>韓国語フレーズ練習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🇰🇷 韓国語フレーズ練習</h1>
    <p class="sub">家族・友達との会話</p>
  </header>

  <main>
    <nav id="modes" class="tabs" aria-label="練習の種類">
      <button class="tab active" data-mode="phrase">📖 フレーズ練習</button>
      <button class="tab" data-mode="listen">🎧 リスニング</button>
    </nav>

    <p id="voice-warning" class="warning" hidden>
      ⚠️ 韓国語の音声が見つかりません。Chrome か Edge で開いてみてね。
    </p>

    <div id="phrase-mode">
    <nav id="scenes" class="chips" aria-label="場面"></nav>

    <div class="row">
      <div id="levels" class="chips small" aria-label="レベル"></div>
      <label class="toggle">
        <input type="checkbox" id="quiz">
        <span>日本語→韓国語で言う</span>
      </label>
    </div>

    <section id="card" class="card">
      <div class="meta">
        <span id="to" class="tag"></span>
        <span id="lv" class="tag lv"></span>
      </div>

      <div id="ja" class="ja"></div>
      <div id="ko-wrap">
        <div id="ko" class="ko"></div>
        <div id="pron" class="pron"></div>
      </div>
      <button id="reveal" class="reveal" hidden>声に出して言ってから、タップで答えを見る 👀</button>

      <div id="extra">
        <div id="polite" class="polite"></div>
        <div id="note" class="note"></div>
      </div>

      <div class="actions">
        <button id="play" class="btn primary">🔊 聞く</button>
        <button id="slow" class="btn">🐢 ゆっくり</button>
        <button id="done" class="btn">✅ 覚えた</button>
      </div>

      <button id="mic" class="btn mic">🎤 話して発音チェック</button>
      <p id="mic-note" class="mic-note" hidden>
        このブラウザでは発音チェックが使えないよ。Chrome で開いてね。
      </p>
      <div id="result" class="result" hidden>
        <div id="score" class="score"></div>
        <div class="heard-row">あなたの発音 → <span id="heard" class="heard"></span></div>
        <div class="heard-row">お手本 → <span id="target" class="target"></span></div>
      </div>
      <div id="stat" class="stat"></div>
    </section>

    <div class="nav">
      <button id="prev" class="btn">◀ 前へ</button>
      <span id="count" class="count"></span>
      <button id="next" class="btn">次へ ▶</button>
    </div>

    <div class="row center">
      <label class="toggle">
        <input type="checkbox" id="hide-done">
        <span>覚えたものは出さない</span>
      </label>
      <button id="shuffle" class="btn small">🔀 シャッフル</button>
      <button id="weak" class="btn small">😣 苦手から</button>
    </div>
    <p id="empty" class="empty" hidden>この条件のフレーズは全部覚えたよ！すごい 🎉</p>
    </div>

    <div id="listen-mode" hidden>
      <div id="listen-levels" class="chips small" aria-label="リスニングのレベル"></div>

      <section class="card">
        <div class="meta">
          <span id="l-level" class="tag"></span>
          <span id="l-to" class="tag"></span>
        </div>
        <p class="l-ask">🎧 韓国語を聞いて、意味を選んでね</p>

        <div class="actions">
          <button id="l-play" class="btn primary">🔊 聞く</button>
          <button id="l-slow" class="btn">🐢 ゆっくり</button>
        </div>

        <div id="l-choices" class="choices"></div>

        <div id="l-answer" class="result" hidden>
          <div id="l-feedback" class="score"></div>
          <div id="l-ko" class="ko small"></div>
          <div id="l-pron" class="pron"></div>
          <div id="l-ja" class="ja"></div>
          <div id="l-note" class="note"></div>
        </div>
        <button id="l-next" class="btn primary wide" hidden>次の問題 ▶</button>
        <div id="l-stat" class="stat"></div>
      </section>
      <p id="l-tally" class="count center-text"></p>
    </div>
  </main>

  <script src="phrases.js"></script>
  <script src="app.js"></script>
  <script src="listening.js"></script>
</body>
</html>
